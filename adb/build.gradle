plugins {
    id 'com.android.library'
    id 'org.jetbrains.kotlin.android'
}

android {
    compileSdkVersion project.properties.compileSdkVersion.toInteger()

    defaultConfig {
        minSdkVersion project.properties.minSdkVersion.toInteger()
        ndk { abiFilters "arm64-v8a" }
        externalNativeBuild {
            cmake { arguments "-DANDROID_STL=c++_static", "-DBORINGSSL_DIR=${buildDir}/boringssl" }
        }
    }
    externalNativeBuild {
        cmake { path "src/main/jni/CMakeLists.txt"; version "3.22.1" }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    kotlinOptions { jvmTarget = "1.8" }
}

configurations { boringsslAar }

// The prefab tool of the Android Gradle Plugin 4.2 only reads schema_version 1, but boringssl uses 2.
// So the AAR is unpacked here and used directly by CMake (see src/main/jni/CMakeLists.txt).
task extractBoringssl(type: Copy) {
    from { zipTree(configurations.boringsslAar.singleFile) }
    into "${buildDir}/boringssl"
}
tasks.whenTaskAdded { t ->
    if (t.name.startsWith('generateJsonModel') || t.name.startsWith('externalNativeBuild') || t.name.startsWith('configureCMake')) {
        t.dependsOn extractBoringssl
    }
}

dependencies {
    boringsslAar "io.github.vvb2060.ndk:boringssl:20250114@aar"
    implementation project(":exec")
    implementation "androidx.core:core-ktx:1.9.0"
    implementation "androidx.lifecycle:lifecycle-runtime:2.6.2"
    implementation "androidx.lifecycle:lifecycle-livedata-core:2.6.2"
    implementation "org.bouncycastle:bcpkix-jdk18on:1.80"
    implementation "org.lsposed.hiddenapibypass:hiddenapibypass:6.1"
}
