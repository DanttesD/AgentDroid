plugins {
    id "com.android.application"
}

android {
    compileSdkVersion project.properties.compileSdkVersion.toInteger()
    ndkVersion = System.getenv("JITPACK_NDK_VERSION") ?: project.properties.ndkVersion
    def appVersionName = System.getenv("TERMUX_APP_VERSION_NAME") ?: ""
    def apkVersionTag = System.getenv("TERMUX_APK_VERSION_TAG") ?: ""
    def splitAPKsForDebugBuilds = System.getenv("TERMUX_SPLIT_APKS_FOR_DEBUG_BUILDS") ?: "1"
    def splitAPKsForReleaseBuilds = System.getenv("TERMUX_SPLIT_APKS_FOR_RELEASE_BUILDS") ?: "0" // F-Droid does not support split APKs #1904

    dependencies {
        implementation "androidx.annotation:annotation:1.3.0"
        implementation "androidx.exifinterface:exifinterface:1.4.2"
        implementation "androidx.media3:media3-exoplayer:1.5.1"
        implementation "androidx.media3:media3-ui:1.5.1"
        implementation "androidx.core:core:1.6.0"
        implementation "androidx.drawerlayout:drawerlayout:1.1.1"
        implementation "androidx.preference:preference:1.1.1"
        implementation "androidx.viewpager:viewpager:1.0.0"
        // MoreFiles requires the JRE flavor; Android 8+ provides the needed Java APIs.
        implementation("com.google.guava:guava:33.3.1-jre") {
            attributes {
                attribute(org.gradle.api.attributes.java.TargetJvmEnvironment.TARGET_JVM_ENVIRONMENT_ATTRIBUTE,
                    objects.named(org.gradle.api.attributes.java.TargetJvmEnvironment,
                        org.gradle.api.attributes.java.TargetJvmEnvironment.STANDARD_JVM))
            }
        }
        implementation "io.noties.markwon:core:$markwonVersion"
        implementation "io.noties.markwon:ext-strikethrough:$markwonVersion"
        implementation "io.noties.markwon:linkify:$markwonVersion"
        implementation "io.noties.markwon:recycler:$markwonVersion"
        implementation "com.atlassian.commonmark:commonmark-ext-gfm-tables:0.13.0"

        implementation project(":x11")
        implementation project(":adb")
        implementation project(":exec")
        implementation project(":agent")
        implementation project(":terminal-view")
        implementation project(":termux-shared")
    }

    defaultConfig {
        applicationId "com.agentdroid"
        ndk { abiFilters "arm64-v8a" }
        minSdkVersion project.properties.minSdkVersion.toInteger()
        targetSdkVersion project.properties.targetSdkVersion.toInteger()
        versionCode 1417
        versionName "2.0.9"

        if (appVersionName) versionName = appVersionName
        validateVersionName(versionName)

        manifestPlaceholders.TERMUX_PACKAGE_NAME = "com.agentdroid"
        manifestPlaceholders.TERMUX_APP_NAME = "AgentDroid"
        manifestPlaceholders.TERMUX_API_APP_NAME = "Termux:API"
        manifestPlaceholders.TERMUX_BOOT_APP_NAME = "Termux:Boot"
        manifestPlaceholders.TERMUX_FLOAT_APP_NAME = "Termux:Float"
        manifestPlaceholders.TERMUX_STYLING_APP_NAME = "Termux:Styling"
        manifestPlaceholders.TERMUX_TASKER_APP_NAME = "Termux:Tasker"
        manifestPlaceholders.TERMUX_WIDGET_APP_NAME = "Termux:Widget"

        externalNativeBuild {
            ndkBuild {
                cFlags "-std=c11", "-Wall", "-Wextra", "-Werror", "-Os", "-fno-stack-protector", "-Wl,--gc-sections"
            }
        }

        splits {
            abi {
                enable ((gradle.startParameter.taskNames.any { it.contains("Debug") } && splitAPKsForDebugBuilds == "1") ||
                    (gradle.startParameter.taskNames.any { it.contains("Release") } && splitAPKsForReleaseBuilds == "1"))
                reset ()
                include 'x86', 'x86_64', 'armeabi-v7a', 'arm64-v8a'
                universalApk true
            }
        }
    }

    signingConfigs {
        debug {
            storeFile rootProject.file('.signing/fork-debug.jks')
            keyAlias 'termux-fork-debug'
            storePassword System.getenv('TERMUX_FORK_KEYSTORE_PASSWORD') ?: 'termux-fork-debug'
            keyPassword System.getenv('TERMUX_FORK_KEYSTORE_PASSWORD') ?: 'termux-fork-debug'
        }
    }

    buildTypes {
        release {
            // Preserve the existing install certificate and the tested, unminified code.
            signingConfig signingConfigs.debug
            minifyEnabled false
            shrinkResources false // Reproducible builds
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }

        debug {
            signingConfig signingConfigs.debug
        }
    }


    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    externalNativeBuild {
        ndkBuild {
            path "src/main/cpp/Android.mk"
        }
    }

    lintOptions {
        disable 'ProtectedPermissions'
    }

    testOptions {
        unitTests {
            includeAndroidResources = true
            all {
                // Robolectric 4.4 retains framework/resource caches across classes.
                // Bound each worker's lifetime for the growing full audit suite.
                maxHeapSize = '768m'
                maxParallelForks = 1
                forkEvery = 40
                systemProperty 'user.home', rootProject.file('.tools/test-home').absolutePath
                systemProperty 'maven.repo.local', rootProject.file('.tools/m2').absolutePath
                systemProperty 'robolectric.dependency.repo.url', 'https://repo.maven.apache.org/maven2'
            }
        }
    }

    packagingOptions {
        jniLibs {
            useLegacyPackaging true
        }
        // The bouncycastle jars (used by the own ADB client) ship identical OSGi metadata.
        resources {
            excludes += ['META-INF/versions/9/OSGI-INF/MANIFEST.MF', 'META-INF/versions/*/OSGI-INF/MANIFEST.MF', 'META-INF/DEPENDENCIES', 'META-INF/LICENSE*', 'META-INF/NOTICE*', 'META-INF/INDEX.LIST']
        }
    }

    applicationVariants.all { variant ->
        variant.outputs.all { output ->
            if (variant.buildType.name == "debug") {
                def abi = output.getFilter(com.android.build.OutputFile.ABI)
                outputFileName = new File("termux-app_" + (apkVersionTag ? apkVersionTag : "debug") + "_" + (abi ? abi : "universal") + ".apk")
            } else if (variant.buildType.name == "release") {
                def abi = output.getFilter(com.android.build.OutputFile.ABI)
                outputFileName = new File("termux-app_" + (apkVersionTag ? apkVersionTag : "release") + "_" + (abi ? abi : "universal") + ".apk")
            }
        }
    }

}

dependencies {
    testImplementation "junit:junit:4.13.2"
    testImplementation "org.robolectric:robolectric:4.4"
}

task versionName {
    doLast {
        print android.defaultConfig.versionName
    }
}

def validateVersionName(String versionName) {
    // https://semver.org/spec/v2.0.0.html#is-there-a-suggested-regular-expression-regex-to-check-a-semver-string
    // ^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)(?:-((?:0|[1-9]\d*|\d*[a-zA-Z-][0-9a-zA-Z-]*)(?:\.(?:0|[1-9]\d*|\d*[a-zA-Z-][0-9a-zA-Z-]*))*))?(?:\+([0-9a-zA-Z-]+(?:\.[0-9a-zA-Z-]+)*))?$
    if (!java.util.regex.Pattern.matches("^(0|[1-9]\\d*)\\.(0|[1-9]\\d*)\\.(0|[1-9]\\d*)(?:-((?:0|[1-9]\\d*|\\d*[a-zA-Z-][0-9a-zA-Z-]*)(?:\\.(?:0|[1-9]\\d*|\\d*[a-zA-Z-][0-9a-zA-Z-]*))*))?(?:\\+([0-9a-zA-Z-]+(?:\\.[0-9a-zA-Z-]+)*))?\$", versionName))
        throw new GradleException("The versionName '"  + versionName + "' is not a valid version as per semantic version '2.0.0' spec in the format 'major.minor.patch(-prerelease)(+buildmetadata)'. https://semver.org/spec/v2.0.0.html.")
}

// Bootstrap for the com.agentdroid prefix. It is built by .github/workflows/bootstrap.yml
// (termux-packages configured for our package name) and described in bootstrap/bootstrap.properties.
// The official bootstrap must NOT be used: its binaries contain the /data/data/com.termux prefix.
def loadBootstrapProps() {
    def props = new Properties()
    def f = new File(rootDir, "bootstrap/bootstrap.properties")
    if (f.exists()) f.withInputStream { props.load(it) }
    return props
}

def sha256Of(File f) {
    def digest = java.security.MessageDigest.getInstance("SHA-256")
    f.withInputStream { input ->
        def buffer = new byte[8192]
        int n
        while ((n = input.read(buffer)) > 0) digest.update(buffer, 0, n)
    }
    def hex = new BigInteger(1, digest.digest()).toString(16)
    while (hex.length() < 64) hex = "0" + hex
    return hex
}

def downloadBootstrap(String arch) {
    def bootstrapProps = loadBootstrapProps()
    def expected = bootstrapProps.getProperty("sha256." + arch, "").trim()
    def url = bootstrapProps.getProperty("url." + arch, "").trim()
    def file = new File(projectDir, "src/main/cpp/bootstrap-" + arch + ".zip")

    if (file.exists() && !expected.isEmpty() && sha256Of(file) == expected) return
    // A locally built archive (e.g. copied from CI output) can be used with -Pagentdroid.localBootstrap=true
    if (file.exists() && project.hasProperty("agentdroid.localBootstrap")) {
        logger.quiet("Using local bootstrap " + file + " (sha256 " + sha256Of(file) + ")")
        return
    }
    if (expected.isEmpty() || url.isEmpty()) {
        throw new GradleException("No bootstrap for '" + arch + "' configured. Run the 'Build bootstrap' workflow, " +
            "put the resulting url/sha256 into bootstrap/bootstrap.properties, or place a self-built archive at " +
            file + " and build with -Pagentdroid.localBootstrap=true.")
    }
    if (file.exists()) { logger.quiet("Deleting bootstrap with wrong hash: " + file); file.delete() }

    logger.quiet("Downloading " + url + " ...")
    file.parentFile.mkdirs()
    def connection = new URL(url).openConnection()
    connection.setInstanceFollowRedirects(true)
    try {
        file.withOutputStream { out -> out << connection.inputStream }
    } catch (Exception e) {
        file.delete()
        throw new GradleException("Download of " + url + " failed: " + e.message, e)
    }
    def actual = sha256Of(file)
    if (actual != expected) {
        file.delete()
        throw new GradleException("Wrong checksum for " + url + ": expected " + expected + ", actual " + actual)
    }
}

clean {
    doLast {
        def tree = fileTree(new File(projectDir, 'src/main/cpp'))
        tree.include 'bootstrap-*.zip'
        tree.each { it.delete() }
    }
}

task downloadBootstraps() {
    doLast {
        // The app is ARM64-only (abiFilters arm64-v8a), so only this archive is needed.
        downloadBootstrap("aarch64")
    }
}

afterEvaluate {
    android.applicationVariants.all { variant ->
        variant.javaCompileProvider.get().dependsOn(downloadBootstraps)
    }
}

// Gradle 7 must select Guava's Android variant, not the JVM variant requiring API26.
configurations.configureEach {
    attributes.attribute(org.gradle.api.attributes.java.TargetJvmEnvironment.TARGET_JVM_ENVIRONMENT_ATTRIBUTE,
        objects.named(org.gradle.api.attributes.java.TargetJvmEnvironment, org.gradle.api.attributes.java.TargetJvmEnvironment.ANDROID))
}

// Check the production configuration: Robolectric may resolve a different JVM variant.
tasks.register("verifyGuavaRuntime") {
    doLast {
        ["debugRuntimeClasspath", "releaseRuntimeClasspath"].each { name ->
            def artifacts = configurations.getByName(name).incoming.artifactView {
                attributes { attribute(org.gradle.api.attributes.Attribute.of("artifactType", String), "jar") }
                componentFilter { id -> id instanceof org.gradle.api.artifacts.component.ModuleComponentIdentifier &&
                    id.group == "com.google.guava" && id.module == "guava" }
            }.artifacts.artifacts
            if (artifacts.size() != 1) throw new GradleException("Expected one Guava runtime artifact in " + name)
            def jar = new java.util.zip.ZipFile(artifacts.first().file)
            try {
                ["com/google/common/io/MoreFiles.class", "com/google/common/io/RecursiveDeleteOption.class", "com/google/common/collect/ImmutableBiMap.class"].each {
                    if (jar.getEntry(it) == null) throw new GradleException("Missing runtime class: " + it + " in " + name)
                }
            } finally { jar.close() }
            logger.lifecycle("Verified Guava file APIs in " + name + ": " + artifacts.first().file.name)
        }
    }
}
tasks.named("preBuild").configure { dependsOn("verifyGuavaRuntime") }
