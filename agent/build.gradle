plugins {
    id 'java-library'
    // The version comes from the buildscript classpath of the root project (Kotlin Gradle plugin 1.7.22).
    id 'org.jetbrains.kotlin.jvm'
}

sourceCompatibility = JavaVersion.VERSION_1_8
targetCompatibility = JavaVersion.VERSION_1_8

tasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinCompile).configureEach {
    kotlinOptions {
        jvmTarget = '1.8'
        // See exec/build.gradle for why these flags are set.
        freeCompilerArgs += ['-Xjvm-default=all', '-Xno-param-assertions', '-Xno-call-assertions', '-Xno-receiver-assertions']
    }
}

dependencies {
    api project(':exec')
    testImplementation 'junit:junit:4.13.2'
}
