buildscript {
    repositories {
        mavenCentral()
        google()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:4.2.2'
        classpath 'com.android.tools:r8:8.9.35'
        classpath 'org.jetbrains.kotlin:kotlin-gradle-plugin:1.7.22'
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
        maven { url "https://jitpack.io" }
    }
}

task clean(type: Delete) {
    delete rootProject.buildDir
}

// Align transitive Guava requests with the JRE variant (same as the root build.gradle of the project).
allprojects {
    dependencies {
        components {
            all { details ->
                details.allVariants {
                    withDependencies { deps ->
                        deps.findAll { it.group == "com.google.guava" && it.name == "guava" }.each { dep ->
                            dep.attributes {
                                attribute(org.gradle.api.attributes.java.TargetJvmEnvironment.TARGET_JVM_ENVIRONMENT_ATTRIBUTE,
                                    objects.named(org.gradle.api.attributes.java.TargetJvmEnvironment,
                                        org.gradle.api.attributes.java.TargetJvmEnvironment.STANDARD_JVM))
                            }
                        }
                    }
                }
            }
        }
    }
}

// ---- unit tests (Robolectric) for both variants of terminal-view, same test sources -------------------------------------
// -ProboVersion=<x>   Robolectric version (default 4.4 = the version of the app module)
// -PtraceDir=<dir>    where the differential tests write their traces
def W = '/data/local/tmp/agentdroid-verify'
def roboVersion = (findProperty('roboVersion') ?: '4.4').toString()
def traceDir = (findProperty('traceDir') ?: "$W/b3/out").toString()

['terminal-view', 'tv-java'].each { name ->
    project(":$name").plugins.withId('com.android.library') {
        project(":$name").with {
            android.sourceSets.test.java.srcDir "$W/src/b3v/tests"
            android.testOptions.unitTests.includeAndroidResources = true
            android.testOptions.unitTests.all {
                maxHeapSize = '768m'
                jvmArgs += [
                        '--add-opens=java.base/java.lang=ALL-UNNAMED',
                        '--add-opens=java.base/java.lang.reflect=ALL-UNNAMED',
                        '--add-opens=java.base/java.io=ALL-UNNAMED',
                        '--add-opens=java.base/java.net=ALL-UNNAMED',
                        '--add-opens=java.base/java.nio=ALL-UNNAMED',
                        '--add-opens=java.base/java.security=ALL-UNNAMED',
                        '--add-opens=java.base/java.text=ALL-UNNAMED',
                        '--add-opens=java.base/java.util=ALL-UNNAMED',
                        '--add-opens=java.base/java.util.concurrent=ALL-UNNAMED',
                        '--add-opens=java.base/sun.nio.ch=ALL-UNNAMED',
                        '--add-opens=java.base/jdk.internal.misc=ALL-UNNAMED',
                        '--add-opens=java.base/sun.security.x509=ALL-UNNAMED',
                        '--add-opens=java.base/sun.security.util=ALL-UNNAMED',
                ]
                systemProperty 'tv.variant', name
                systemProperty 'tv.trace.dir', traceDir
                systemProperty 'user.home', "$W/b3/test-home"
                systemProperty 'maven.repo.local', "$W/b3/m2"
                systemProperty 'robolectric.dependency.repo.url', 'https://repo.maven.apache.org/maven2'
                testLogging {
                    events 'passed', 'skipped', 'failed'
                    exceptionFormat 'full'
                    showStackTraces true
                }
            }
            dependencies {
                testImplementation 'junit:junit:4.13.2'
                testImplementation "org.robolectric:robolectric:$roboVersion"
            }
        }
    }
}
